name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Quality and release artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.7

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.14.7

      - name: Run Ruff linting
        run: .venv/bin/ruff check .

      - name: Check Ruff formatting
        run: .venv/bin/ruff format --check .

      - name: Run MyPy
        run: .venv/bin/mypy src

      - name: Run tests
        run: .venv/bin/pytest

      - name: Build wheel and source distribution
        run: .venv/bin/python -m build

      - name: Validate distribution metadata
        run: .venv/bin/python -m twine check --strict dist/*

      - name: Smoke-test installed wheel
        run: scripts/smoke-test-wheel.sh dist/*.whl

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screwdriver-distributions
          path: dist/*
          if-no-files-found: error
