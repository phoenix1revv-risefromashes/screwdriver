[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "screwdriver"
version = "0.1.0"
description = "Vendor-neutral Linux inspection and diagnostics for robotic systems."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Phoenix Bogati" },
]
dependencies = []

[project.scripts]
screwdriver = "screwdriver.cli:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/screwdriver"]