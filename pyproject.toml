[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "screwdriver-robotics"
version = "0.0.0"
description = "Agentic inspection and diagnostics for Linux robotics systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Phoenix Bogati" }
]
keywords = [
    "robotics",
    "diagnostics",
    "linux",
    "hardware",
    "agentic-ai",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
screwdriver = "screwdriver.cli:main"

[project.urls]
Repository = "https://github.com/phoenix1revv-risefromashes/screwdriver"
Issues = "https://github.com/phoenix1revv-risefromashes/screwdriver/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"