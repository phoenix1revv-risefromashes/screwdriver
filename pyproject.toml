[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "screwdriver-robotics"
version = "1.3.0"
description = "Agentic inspection and diagnostics for Linux robotics systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9,<8",
    "typer>=0.12,<1",
    "PyYAML>=6,<7",
]


[project.scripts]
screwdriver = "screwdriver.cli:main"
screwdriver-ssh = "screwdriver.ssh_client:main"


[dependency-groups]
dev = [
    "build>=1.2,<2",
    "mypy>=2.3.0",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "twine>=6.1,<7",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260906",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--disable-plugin-autoload",
    "--strict-config",
    "--strict-markers",
]


[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
